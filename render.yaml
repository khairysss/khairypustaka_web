# Render Blueprint — KhairyPustaka Web (web-only, bot Telegram DIMATIKAN)
# Deploy: New > Blueprint dari repo git yang berisi render.yaml ini.
services:
  - type: web
    name: khairypustaka-web
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # T-2 (audit 2026-10-17): 8 thread (default 4) supaya segelintir request
    # lambat tidak melumpuhkan seluruh situs; dilengkapi batas konkurensi
    # per-IP + global untuk endpoint mahal di app.py (with_heavy).
    startCommand: waitress-serve --listen=0.0.0.0:$PORT --threads=8 app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: BASE_URL
        value: https://khairypustaka-web.onrender.com
      - key: BOT_DATA_DIR
        value: /opt/render/project/src/botdata
      - key: WEB_SECRET
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: ""
      - key: WIJAYAPAY_API_KEY
        sync: false
      - key: WIJAYAPAY_MERCHANT
        sync: false
      # Lapisan dbstore: bila DATABASE_URL diisi (Neon/Supabase), 15+ file JSON
      # state pindah ke Postgres. Bila kosong, app tetap jalan mode file lokal
      # (data hilang tiap deploy/restart di Render free).
      - key: DATABASE_URL
        sync: false
