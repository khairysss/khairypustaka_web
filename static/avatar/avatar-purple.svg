@keyframes apBlink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.1)}}
@keyframes apTw{0%,100%{opacity:.3;transform:scale(.65) rotate(0deg)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.ap-bot,.ap-mata,.ap-spark{animation:none}}
</style>
