# KhairyPustaka Guardian — penjaga otomatis (Lapis 3, 2026-10-29).
# Tugas: tiap 10 menit cek /api/health. Bila 2x probe gagal (jeda 60 detik),
# restart service Render lewat API, lalu kabari Sul lewat Telegram bila
# secret Telegram tersedia. TIDAK menyentuh kuota AI (hanya health check).
# Secret yang dibutuhkan di repo Settings > Secrets and variables > Actions:
#   RENDER_API_KEY    (wajib untuk restart; dibuat di Render Dashboard >
#                      Account Settings > API Keys)
#   RENDER_SERVICE_ID (wajib untuk restart; ID srv-... dari URL dashboard
#                      service khairypustaka-web)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (opsional, untuk notifikasi)
# Bila secret restart belum ada, workflow hanya mencatat (exit 0) — tidak
# pernah gagal berisik. Bila situs sehat, workflow diam tanpa aksi.
name: KhairyPustaka Guardian

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe health (2x, jeda 60 detik)
        id: probe
        run: |
          SITE="https://pustaka.khairys.web.id/api/health"
          healthy=0
          for i in 1 2; do
            if curl -fsS -m 30 "$SITE" >/dev/null 2>&1; then
              echo "probe $i OK"
              healthy=1
              break
            fi
            echo "probe $i GAGAL"
            if [ "$i" = "1" ]; then sleep 60; fi
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"

      - name: Restart service Render bila 2x probe gagal
        id: restart
        if: steps.probe.outputs.healthy == '0'
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ] || [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_ID belum diset — lewati restart."
            echo "restarted=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/restart"
          echo "restarted=yes" >> "$GITHUB_OUTPUT"
          echo "Restart diminta ke Render."

      - name: Notifikasi Telegram (bila dikonfigurasi)
        if: steps.probe.outputs.healthy == '0'
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Telegram belum dikonfigurasi — lewati notifikasi."
            exit 0
          fi
          MSG="KhairyPustaka Guardian: situs tidak merespons 2x probe (health check), restart: ${{ steps.restart.outputs.restarted }}. Waktu: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" >/dev/null
          echo "Notifikasi Telegram terkirim."
